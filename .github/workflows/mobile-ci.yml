name: Mobile CI

# The React Native/TypeScript skeleton under mobile/ - see mobile/README.md.
# Scoped to that path so it stays independent of the existing Android/Kotlin
# CI job in ci.yml while both are evaluated side by side.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Equivalent of the Gradle `checkModuleBoundaries` task: feature/seller
      # and feature/buyer must stay independent.
      - name: Module boundaries
        run: pnpm boundaries

      - name: Lint
        run: pnpm lint

      - name: Domain unit tests
        run: pnpm --filter @akaar/core-domain test

      - name: Typecheck
        run: pnpm typecheck && pnpm typecheck:app
